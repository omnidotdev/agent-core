name: Release 🏗️

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun so the toolchain does not drift with floating latest
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # agent-core is consumed as a git dependency, not published to a registry.
      # `bun release` runs `changeset publish`, which (with privatePackages.tag
      # enabled in .changeset/config.json) creates the `vX.Y.Z` git tag; the action
      # then pushes it and opens the GitHub Release. On a push that still has
      # pending changesets, the action instead opens/updates the version PR, whose
      # version step also syncs Cargo.toml and Cargo.lock
      - name: Create release PR or tag release
        uses: changesets/action@v2
        with:
          version-script: bun run version && cargo update --workspace
          publish-script: bun release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
